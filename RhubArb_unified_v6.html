<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F8">
<title>RhubArb — statistics, not signals</title>
<meta name="description" content="RhubArb analyses the statistical relationship between two assets: the spread, whether it is real, and when it stops being real. Read-only. It will never tell you to trade.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --rhubarb-050:#FAF3F5; --rhubarb-100:#F4E4E9; --rhubarb-200:#E7C5CF; --rhubarb-300:#D9A3B2;
  --rhubarb-400:#CD8899; --rhubarb-500:#C06C84; --rhubarb-600:#A85770; --rhubarb-700:#8A4459;
  --rhubarb-800:#6B3445; --rhubarb-900:#4A2430;
  --ink:#322A31; --ink-muted:#6E6470; --surface:#FFFFFF; --canvas:#FAF7F8; --line:#EDE4E8;
  --series-a:#C06C84; --series-b:#786876;
  --stable:#4E9B7A; --watch:#C99A3A; --shift:#8E2F3C;
  --stable-t:#E4F1EB; --watch-t:#F7EEDA; --shift-t:#F3E0E3;

  --ease:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --t-fast:130ms; --t:240ms; --t-slow:420ms;
  --r-xs:2px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(50,42,49,.04), 0 2px 8px rgba(50,42,49,.04);
  --shadow-2:0 2px 4px rgba(50,42,49,.05), 0 12px 28px rgba(138,68,89,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:Quicksand,system-ui,sans-serif;font-weight:500;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- layout ---------- */

.nav{
  position:sticky;top:0;z-index:50;background:var(--canvas);
  border-bottom:1px solid transparent;transition:border-color var(--t) var(--ease);
}
.nav.stuck{border-bottom-color:var(--line)}
.nav .inner{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand .mk{width:28px;height:28px;flex:0 0 auto}
.navlinks{display:flex;gap:4px;margin-left:auto}
.navlink{
  position:relative;padding:8px 14px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;
  color:var(--ink-muted);transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);
}
.navlink:hover{color:var(--ink);background:var(--rhubarb-050)}
.navlink[aria-current]{color:var(--rhubarb-700)}
.navlink[aria-current]::after{
  content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:var(--r-xs);
  background:var(--rhubarb-500);animation:growIn var(--t) var(--ease) both;
}
@keyframes growIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}

/* ---------- entrance ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:riseIn var(--t-slow) var(--ease) both}

/* ---------- hero ---------- */
.hero{padding:44px 0 26px}
.kicker{
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--rhubarb-500);
}
.hero h1{font-size:38px;line-height:1.12;font-weight:700;margin:12px 0 10px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--rhubarb-700)}
.hero p{margin:0;color:var(--ink-muted);font-size:15px;max-width:52ch;line-height:1.6}
.traces{width:100%;height:64px;margin-top:22px;overflow:visible}

/* ---------- stat strip ---------- */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 30px}
.sbox{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease);
}
.sbox:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--rhubarb-200)}
.sbox .v{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:26px;letter-spacing:-.02em}
.sbox .l{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-muted);margin-top:8px}

/* ---------- chips ---------- */
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
.chip{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-muted);
  border-radius:var(--r-pill);padding:8px 15px;font-size:12.5px;font-weight:600;
  transition:all var(--t-fast) var(--ease);
}
.chip:hover{border-color:var(--rhubarb-300);color:var(--ink)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--rhubarb-500);border-color:var(--rhubarb-500);color:#fff}

/* ---------- section head ---------- */
.shead{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
.shead h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.shead .count{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-muted)}

/* ---------- pair grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pcard{
  position:relative;overflow:hidden;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease);
}
.pcard::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--rhubarb-500));
  transform:scaleY(0);transform-origin:top;transition:transform var(--t) var(--ease);
}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--rhubarb-200)}
.pcard:hover::before{transform:scaleY(1)}
.pcard:active{transform:translateY(-1px) scale(.995)}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pc-name{font-size:15.5px;font-weight:700;line-height:1.25}
.pc-sub{font-size:11px;color:var(--ink-muted);margin-top:4px}
.pc-chart{margin:14px 0 4px;height:52px}
.pc-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pc-z .l{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;color:var(--ink-muted)}
.pc-z .v{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:21px;line-height:1.1;letter-spacing:-.02em}
.pc-hl{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-muted);text-align:right}

.badge{
  font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:5px 9px;border-radius:var(--r-sm);white-space:nowrap;flex:0 0 auto;font-weight:500;
}
.b-stable{background:var(--stable-t);color:var(--stable)}
.b-watch{background:var(--watch-t);color:var(--watch)}
.b-shift{background:var(--shift-t);color:var(--shift)}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  color:var(--rhubarb-700);padding:8px 0;transition:gap var(--t-fast) var(--ease)}
.back:hover{gap:11px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:10px 0 26px;flex-wrap:wrap}
.dhead h1{font-size:31px;font-weight:700;margin:0;letter-spacing:-.02em}
.dhead .meta{color:var(--ink-muted);font-size:13px;margin-top:6px}
.zbig{text-align:right}
.zbig .l{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-muted)}
.zbig .v{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:46px;line-height:1;
  letter-spacing:-.03em;margin-top:6px}
.zbig .n{font-size:11.5px;color:var(--ink-muted);margin-top:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px}
.card h3{margin:0;font-size:16px;font-weight:700}
.card .sub{font-size:12px;color:var(--ink-muted);margin-top:5px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}

.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease)}
.m:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--rhubarb-200)}
.m .l{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-muted)}
.m .v{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;margin-top:8px;letter-spacing:-.02em}
.m .n{font-size:10px;color:var(--ink-muted);margin-top:5px}

.chartwrap{position:relative;margin-top:16px;cursor:crosshair}
.readout{
  position:absolute;top:0;left:0;pointer-events:none;opacity:0;
  background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:7px 10px;
  font-family:"JetBrains Mono",monospace;font-size:10.5px;white-space:nowrap;
  transform:translate(-50%,-118%);transition:opacity var(--t-fast) var(--ease);z-index:5;
}
.chartwrap.live .readout{opacity:1}
.legend{display:flex;gap:18px;align-items:center;margin-top:14px;
  font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-muted);flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

.krow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.krow:last-child{border-bottom:0}
.krow .k{font-size:13px}
.krow .v{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px}

.check{display:flex;align-items:center;gap:13px;padding:10px 0}
.check .dot{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.check .t{font-size:13px;flex:1}
.check .v{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-muted)}

.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-top:16px}
.d{background:var(--rhubarb-050);border-radius:var(--r-md);padding:13px 14px;
  transition:background var(--t-fast) var(--ease)}
.d:hover{background:var(--rhubarb-100)}
.d .l{font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-muted)}
.d .v{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:18px;margin-top:7px}

.notice{border-radius:var(--r-md);padding:14px 16px;font-size:12px;line-height:1.55;margin-top:16px}
.n-rose{background:var(--rhubarb-050);color:var(--rhubarb-700)}
.n-shift{background:var(--shift-t);color:var(--shift)}
.n-watch{background:var(--watch-t);color:#7a5c1f}


/* ---------- plain-English verdict ---------- */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px 24px;margin-bottom:16px}
.verdict .lede{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.01em}
.verdict .lede b{color:var(--rhubarb-700);font-weight:700}
.verdict .caveat{margin-top:12px;font-size:12px;color:var(--ink-muted);line-height:1.55}
.verdict.is-shift{border-color:var(--shift-t);border-left:3px solid var(--shift)}
.verdict.is-watch{border-left:3px solid var(--watch)}
.verdict.is-stable{border-left:3px solid var(--stable)}

/* ---------- plain-language gloss under any figure ---------- */
.gloss{font-size:11px;line-height:1.45;color:var(--ink-muted);margin-top:7px}
.m .gloss{margin-top:6px}
body.terse .gloss{display:none}
body.terse .verdict .caveat{display:none}


.app-surface{padding-top:8px}

/* ---------- last-close prices ---------- */
.px{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line)}
.px .leg{display:flex;align-items:baseline;gap:8px}
.px .tk{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;
  color:var(--ink-muted);text-transform:uppercase}
.px .val{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;letter-spacing:-.02em}
.px .dl{font-family:"JetBrains Mono",monospace;font-size:11px}
.px .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px}
.px .stamp{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:9.5px;
  color:var(--ink-muted);letter-spacing:.04em}
.pc-px{display:flex;gap:14px;margin-top:9px;font-family:"JetBrains Mono",monospace;font-size:10.5px;
  color:var(--ink-muted)}
.pc-px b{color:var(--ink);font-weight:700}
@media(max-width:620px){ .px{gap:14px} .px .stamp{margin-left:0;width:100%} }


/* ---------- watchlist ---------- */
.watchbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-md);padding:9px 14px;font-size:12.5px;
  font-weight:600;color:var(--ink-muted);transition:all var(--t-fast) var(--ease)}
.watchbtn:hover{border-color:var(--rhubarb-300);color:var(--ink)}
.watchbtn[aria-pressed="true"]{background:var(--rhubarb-050);border-color:var(--rhubarb-300);
  color:var(--rhubarb-700)}
.watchbtn svg{display:block}
.pc-watch{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--ink-muted);opacity:0;
  transition:opacity var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.pcard:hover .pc-watch{opacity:1}
.pc-watch:hover{background:var(--rhubarb-050)}
.pc-watch[aria-pressed="true"]{opacity:1;color:var(--rhubarb-600)}
.navcount{display:inline-block;min-width:17px;padding:1px 5px;margin-left:6px;border-radius:var(--r-pill);
  background:var(--rhubarb-600);color:#fff;font-family:"JetBrains Mono",monospace;font-size:9.5px;
  line-height:1.6;text-align:center;font-weight:700}

/* ---------- what changed ---------- */
.changed{background:var(--surface);border:1px solid var(--rhubarb-200);border-left:3px solid var(--rhubarb-500);
  border-radius:var(--r-lg);padding:20px 22px;margin-bottom:18px}
.changed h3{margin:0 0 4px;font-size:16.5px;font-weight:700}
.changed .when{font-size:11.5px;color:var(--ink-muted);margin-bottom:14px}
.chg-item{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.chg-item:first-of-type{border-top:0}
.chg-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.chg-body{flex:1}
.chg-name{font-size:13.5px;font-weight:700}
.chg-what{font-size:12px;color:var(--ink-muted);line-height:1.55;margin-top:3px}
.chg-num{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink)}
.changed .foot-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-muted);line-height:1.55}
.emptywatch{background:var(--surface);border:1px dashed var(--rhubarb-200);border-radius:var(--r-lg);
  padding:34px 26px;text-align:center}
.emptywatch h3{margin:0 0 8px;font-size:17px}
.emptywatch p{margin:0 auto 16px;font-size:13px;color:var(--ink-muted);max-width:46ch;line-height:1.6}


/* ---------- guided first pair ---------- */
.tour{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.tour[open]{display:flex}
.tour .scrim{position:absolute;inset:0;background:rgba(50,42,49,.52)}
.tourcard{position:relative;width:560px;max-width:100%;max-height:88vh;overflow:auto;
  background:var(--surface);border-radius:var(--r-lg);padding:30px 32px 26px;
  box-shadow:0 18px 60px rgba(50,42,49,.26);animation:riseIn 280ms var(--ease) both}
.tourcard .step{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-text);margin-bottom:10px}
.tourcard h2{margin:0 0 10px;font-size:25px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.tourcard p{margin:0 0 14px;font-size:14.5px;line-height:1.65;color:var(--ink-muted)}
.tourcard p strong{color:var(--ink);font-weight:600}
.tourcard .chartbox{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin:16px 0}
.tourcard .chartbox .cap{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px}
.tourpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.tourpick button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);
  padding:15px 14px;text-align:left;transition:all var(--t-fast) var(--ease)}
.tourpick button:hover{border-color:var(--rhubarb-300);background:var(--rhubarb-050)}
.tourpick .t{font-size:14px;font-weight:700;display:block}
.tourpick .s{font-size:11.5px;color:var(--ink-muted);display:block;margin-top:3px}
.verdictline{border-radius:var(--r-md);padding:14px 16px;margin:14px 0;font-size:13.5px;line-height:1.6}
.v-right{background:var(--stable-t);color:var(--stable-text)}
.v-wrong{background:var(--watch-t);color:var(--watch-text)}
.tourfoot{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;
  border-top:1px solid var(--line);flex-wrap:wrap}
.tourfoot .dots{display:flex;gap:6px;margin-right:auto}
.tourfoot .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tourfoot .dot.on{background:var(--rhubarb-500)}
.tourskip{font-size:12.5px;font-weight:600;color:var(--ink-muted);padding:10px 4px}
.tourskip:hover{color:var(--ink)}
.tournext{background:var(--rhubarb-600);color:#fff;border-radius:var(--r-md);
  padding:12px 20px;font-size:13.5px;font-weight:600}
.tournext:hover{background:var(--rhubarb-700)}
.tourhint{width:100%;font-size:11.5px;color:var(--ink-muted);margin-top:2px}
@media(max-width:620px){ .tourcard{padding:24px 20px} .tourcard h2{font-size:21px} .tourpick{grid-template-columns:1fr} }


/* ---------- break records ---------- */
.brk{border:1px solid var(--line);border-radius:var(--r-md);padding:15px 17px;margin-bottom:11px}
.brk.shift{border-left:3px solid var(--shift)}
.brk.watch{border-left:3px solid var(--watch)}
.brk-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brk-label{font-size:14px;font-weight:700}
.brk-sev{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.11em;
  text-transform:uppercase;padding:3px 8px;border-radius:var(--r-sm)}
.sev-high{background:var(--shift-t);color:var(--shift-text)}
.sev-moderate{background:var(--watch-t);color:var(--watch-text)}
.sev-check{background:var(--rhubarb-100);color:var(--rhubarb-700)}
.brk-when{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-muted)}
.brk-what{font-size:12.5px;line-height:1.6;color:var(--ink-muted);margin-top:7px}
.brk-num{display:flex;gap:9px;align-items:baseline;margin-top:10px;flex-wrap:wrap;
  font-family:"JetBrains Mono",monospace;font-size:11.5px}
.brk-num .m{color:var(--ink-muted);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.brk-num .arrow{color:var(--ink-muted)}
.nobreak{background:var(--stable-t);border-radius:var(--r-md);padding:14px 16px;
  font-size:12.5px;color:var(--stable-text);line-height:1.55}

/* ---------- evidence card ---------- */
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:16px}
.ev-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:6px}
.ev-label{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;padding:5px 10px;border-radius:var(--r-sm)}

   All statistics are genuinely computed from deterministic synthetic

/* ---------- deterministic pseudo-random ---------- */
function rng(seed){let s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ---------- synthetic co-moving pair ---------- */
function genPair(seed,n,o){
  o=o||{};const r=rng(seed);
  const common=[];let c=0;
  for(let i=0;i<n;i++){c+=gauss(r)*0.0125;common.push(c);}
  const eps=[];let e=0;const theta=o.theta==null?0.055:o.theta;
  for(let i=0;i<n;i++){e+=-theta*e+gauss(r)*0.0052;eps.push(e);}
  const brk=o.breakAt||null;const A=[],B=[];let drift=0;

  /* Distinct failure modes, so every detector has a known positive. */
  const corrAt=o.corrAt||null, slopeAt=o.slopeAt||null,
        volAt=o.volAt||null,   splitAt=o.splitAt||null;

  let aAcc=Math.log(100), bAcc=Math.log(96), prevC=0, indep=0;
  for(let i=0;i<n;i++){
    if(brk!==null&&i>=brk) drift+=(o.breakDrift||0.00075);
    const vm=(volAt!==null&&i>=volAt)?(o.volMul||3.4):1;
    const dC=(common[i]-prevC); prevC=common[i];

    aAcc+=dC*vm;
    A.push(aAcc+eps[i]*0.5*vm+i*(o.driftA||0.00022));

    if(corrAt!==null&&i>=corrAt){
      indep+=gauss(r)*0.013;
      B.push(Math.log(96)+common[corrAt-1]+indep+i*(o.driftB||0.00016));
    } else {
      const sens=(slopeAt!==null&&i>=slopeAt)?(o.slopeMul||2.6):1;
      bAcc+=dC*sens*vm;
      let v=bAcc-eps[i]*0.5*vm+i*(o.driftB||0.00016)-drift;
      if(splitAt!==null&&i>=splitAt) v-=Math.log(2);
      B.push(v);
    }
  }
  return {logA:A,logB:B};
}

/* ---------- statistics (really computed) ---------- */
function olsBeta(x,y){
  const n=x.length;let sx=0,sy=0,sxx=0,sxy=0;
  for(let i=0;i<n;i++){sx+=x[i];sy+=y[i];sxx+=x[i]*x[i];sxy+=x[i]*y[i];}
  const d=n*sxx-sx*sx;return d?(n*sxy-sx*sy)/d:1;
}
function spreadOf(a,b){const beta=olsBeta(b,a);return{beta:beta,s:a.map((v,i)=>v-beta*b[i])};}
function rollingZ(s,w){
  const out=new Array(s.length).fill(null);
  for(let i=w;i<s.length;i++){
    const win=s.slice(i-w,i);
    const m=win.reduce((x,y)=>x+y,0)/w;
    const sd=Math.sqrt(win.reduce((x,y)=>x+(y-m)*(y-m),0)/(w-1))||1e-9;
    out[i]=(s[i]-m)/sd;
  }
  return out;
}
function returns(l){const o=[];for(let i=1;i<l.length;i++)o.push(l[i]-l[i-1]);return o;}
function corr(a,b){
  const n=Math.min(a.length,b.length);let ma=0,mb=0;
  for(let i=0;i<n;i++){ma+=a[i];mb+=b[i];}ma/=n;mb/=n;
  let num=0,da=0,db=0;
  for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;num+=x*y;da+=x*x;db+=y*y;}
  return num/(Math.sqrt(da*db)||1e-12);
}
function halfLife(s){
  const x=[],y=[];
  for(let i=1;i<s.length;i++){x.push(s[i-1]);y.push(s[i]-s[i-1]);}
  const k=olsBeta(x,y);
  return k>=0?null:Math.log(2)/(-k);
}
function excursions(z,thr){
  let count=0,inx=false,start=0,lens=[],rev=0,worst=0;
  for(let i=0;i<z.length;i++){
    const v=z[i];if(v===null)continue;
    if(Math.abs(v)>thr&&!inx){inx=true;start=i;count++;}
    if(Math.abs(v)>Math.abs(worst))worst=v;
    if(inx&&Math.abs(v)<0.5){inx=false;lens.push(i-start);rev++;}
  }
  lens.sort((a,b)=>a-b);
  return{count:count,median:lens.length?lens[Math.floor(lens.length/2)]:null,
         revertedShare:count?rev/count:0,worst:worst};
}

/* ---------- universe ---------- */
const N=1260, W=90;
/* The demonstration series advance one step per real day, so that "what changed
   since your last visit" is a real comparison rather than a fixed picture.
   Still deterministic and still synthetic — only the window slides. */
const MAXOFF=180;
const DAY0=Date.UTC(2026,8,14);
const OFF=Math.max(0,Math.min(MAXOFF,Math.floor((Date.now()-DAY0)/86400000)));
const RAW=[

const PAIRS=RAW.map(p=>{
  const gFull=genPair(p.seed,N+MAXOFF,p.o);
  const g={logA:gFull.logA.slice(OFF,OFF+N), logB:gFull.logB.slice(OFF,OFF+N)};
  const sp=spreadOf(g.logA,g.logB);
  const z=rollingZ(sp.s,W);
  const rho=corr(returns(g.logA).slice(-250),returns(g.logB).slice(-250));
  const hl=halfLife(sp.s.slice(-500));
  const ex=excursions(z,2);
  const n=g.logA.length;
  const bR=olsBeta(g.logB.slice(n-250),g.logA.slice(n-250));
  const bP=olsBeta(g.logB.slice(n-500,n-250),g.logA.slice(n-500,n-250));
  const broke=!!p.o.breakAt;
  const zNow=z[z.length-1];
  let state = broke ? 'shift' : (Math.abs(zNow)>2 ? 'watch' : 'stable');
  return Object.assign({},p,{
    logA:g.logA,logB:g.logB,beta:sp.beta,spread:sp.s,z:z,zNow:zNow,rho:rho,
    halfLife:hl,ex:ex,betaDrift:bR-bP,state:state,broke:broke,
    cointegrated:!broke, adfp: broke?0.412:(0.004+(p.seed%37)/37*0.03), overlap:N
  });
});

/* Last close and one-day change, derived from the series already computed.
   These are DEMONSTRATION figures from synthetic data, labelled as such
   everywhere they appear. No live feed, no real-time claim. */
PAIRS.forEach(p=>{
  const la=p.logA, lb=p.logB, n=la.length;
  p.pxA = Math.exp(la[n-1]);
  p.pxB = Math.exp(lb[n-1]);
  p.chA = (Math.exp(la[n-1]-la[n-2])-1)*100;
  p.chB = (Math.exp(lb[n-1]-lb[n-2])-1)*100;
});
/* evidence + break detection, computed once per pair */
PAIRS.forEach(p=>{
  const n=p.logA.length;
  /* the interval must be computed on the same window as the beta we show,
     otherwise the point estimate can fall outside its own interval */
  const ci=betaInterval(p.logB, p.logA);
  p.betaLo=ci.lo; p.betaHi=ci.hi; p.betaSE=ci.se; p.obs=ci.n;
  p.rsq=rsqSpread(p.spread.slice(-500));
  /* out-of-sample: establish on the first half, check on the second */
  const halfN=Math.floor(n/2);
  const inB =olsBeta(p.logB.slice(0,halfN), p.logA.slice(0,halfN));
  const oosSpread=[]; for(let i=halfN;i<n;i++) oosSpread.push(p.logA[i]-inB*p.logB[i]);
  const oosHL=halfLife(oosSpread);
  p.oos={ beta:inB, halfLife:oosHL, holds: !!(oosHL && oosHL<250) };
  p.breaks=detectBreaks(p);
  p.evidence=evidenceLabel(p);
  /* the headline state is derived from what was actually detected, so the
     badge, the verdict and the evidence card can never disagree */
  if(p.breaks.some(b=>b.cls==='shift'))      p.state='shift';
  else if(p.breaks.length || Math.abs(p.zNow)>2) p.state='watch';
  else                                        p.state='stable';
  p.broke = p.state==='shift';
  p.cointegrated = !p.breaks.some(b=>b.type==='residual'||b.type==='correlation');
});

/* ---------- svg chart primitives ---------- */
function pathD(vals,w,h,lo,hi,pad){
  pad=pad||0;const n=vals.length,span=(hi-lo)||1;let d='';
  for(let i=0;i<n;i++){
    const x=(i/(n-1))*w, y=pad+(h-2*pad)*(1-(vals[i]-lo)/span);
    d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';
  }
  return d.trim();
}
/* two series always share one vertical scale — the gap is the subject */
function sharedScale(A,B){
  const all=A.concat(B);
  return {lo:Math.min.apply(null,all),hi:Math.max.apply(null,all)};
}

/* sparkline for cards */
function spark(p,w,h,k){

function rollSeries(p,fn,k){
  const out=[],n=p.logA.length,step=Math.floor((n-500)/k);
  for(let i=0;i<k;i++) out.push(fn(p,500+i*step));

function countUp(el,to,dec,prefixNeg){
  const dur=760, t0=performance.now(), from=0;
  function step(t){
    const k=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-k,4);
    const v=from+(to-from)*e;
    el.textContent=(prefixNeg&&v<0?'−':'')+Math.abs(v).toFixed(dec);
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- term definitions ----------
   Written to acknowledge difficulty rather than assume familiarity.
   Nothing here defines a term by using three more.               */
const TERMS={
 spread:['Spread',
   'The gap between two assets once you have accounted for how much one normally moves against the other. It is the actual thing RhubArb studies \u2014 not the prices themselves.'],
 hedge:['Hedge ratio (\u03b2)',
   'How much of the second asset moves with one unit of the first. You need it before you can subtract one from the other, otherwise the gap is meaningless.',
   'The symbol \u03b2 is just a label for that number. It carries no other meaning.'],
 zscore:['Z-score',
   'How unusual today\u2019s gap is compared with its own recent history, counted in standard deviations. A z-score of 2 means wider than roughly 95% of the recent past.',
   'Most people find this one easier once they stop reading it as a score out of anything. It is a distance, not a grade.'],
 coint:['Cointegration',
   'Two prices that each wander unpredictably, but whose <em>gap</em> keeps returning to a normal level. That is a much stronger claim than \u201cthey move together\u201d.',
   'This is the idea the whole product rests on, and it takes most people a while to separate from correlation. That is normal.'],
 corr:['Correlation',
   'Whether two assets tend to move in the same direction day to day. Useful, but it cannot tell you whether the gap between them ever comes back \u2014 which is the part that matters.'],
 halflife:['Half-life',
   'How long a gap has historically taken to close half the distance back to normal. Twelve days means gaps have typically halved in about twelve days.',
   'Probably the least intuitive number on the page. It describes speed, not certainty, and it is measured on the past only.'],
 adf:['ADF p-value',
   'The output of a statistical test asking whether the gap reliably returns. Lower means stronger evidence. Below 0.05 is the usual threshold.',
   'A low value is evidence, never proof. It describes what has happened, not what will.'],
 regime:['Regime shift',
   'When a relationship stops holding \u2014 a strategy change, an acquisition, a regulatory shift. The two assets carry on existing, but the link between them has broken.',
   'This is the failure that hurts people, because the statistics keep producing confident-looking numbers after the relationship has gone.'],
 evidence:['Evidence label',
   'A plain verdict on how much weight a relationship can carry: insufficient evidence, historically stable, weakening, or structurally changed.',
   'Deliberately a label, not a score. A score invites ranking, and a ranking is a recommendation wearing a number.'],
 oos:['Out-of-sample',
   'Testing the relationship on a period that was not used to find it. Established on the first half of the window, checked on the second.',
   'The cleanest defence against fooling yourself. A pair that holds only where it was discovered is reported as weaker, not stronger.'],
 rsq:['R-squared on the spread',
   'How much of the spread’s movement the fitted model accounts for.',
   'Reported on the spread only. On raw price levels R² is misleading — two unrelated random walks can produce a high value, which is the exact error this product exists to expose.'],
 overlap:['Overlap',
   'The number of days both assets actually traded. Two assets on different exchanges do not share a calendar, and comparing days that do not line up produces nonsense.']
};
function TERM(word,key){
  const d=TERMS[key];
  if(!d) return word;
  return '<span class="termwrap"><button class="term" data-term="'+key+'" aria-expanded="false">'
    + word + '</button><span class="termdef" role="tooltip"><b>' + d[0] + '</b>' + d[1]
    + (d[2]?'<span class="hard">'+d[2]+'</span>':'') + '</span></span>';
}


/* ══════════════ WATCHLIST + CHANGE DETECTION ══════════════
   Stored locally in this browser. No account, no server, nothing
   sent anywhere. When accounts exist this moves server-side and
   the same comparison becomes an emailed alert.               */
const WKEY='rb_watch', SKEY='rb_snap', VKEY='rb_lastvisit';

function watchGet(){
  try{ return JSON.parse(localStorage.getItem(WKEY)||'[]'); }catch(e){ return []; }
}
function watchSet(a){
  try{ localStorage.setItem(WKEY, JSON.stringify(a)); }catch(e){}
}
function isWatched(id){ return watchGet().indexOf(id)>-1; }
function watchToggle(id){
  const a=watchGet(); const i=a.indexOf(id);
  if(i>-1) a.splice(i,1); else a.push(id);
  watchSet(a); return a.indexOf(id)>-1;
}

/* snapshot the watched pairs so the next visit can be compared */
function snapTake(){
  const snap={};
  watchGet().forEach(id=>{
    const p=PAIRS.find(x=>x.id===id);
    if(p) snap[id]={z:p.zNow, state:p.state, adfp:p.adfp, beta:p.beta, coint:p.cointegrated};
  });
  try{
    localStorage.setItem(SKEY, JSON.stringify(snap));
    localStorage.setItem(VKEY, String(Date.now()));
  }catch(e){}
}
function snapRead(){
  try{ return JSON.parse(localStorage.getItem(SKEY)||'{}'); }catch(e){ return {}; }
}
function lastVisit(){
  try{ const v=localStorage.getItem(VKEY); return v?parseInt(v,10):null; }catch(e){ return null; }
}
function agoText(ms){
  if(ms==null) return '';
  const d=Math.floor((Date.now()-ms)/86400000);
  if(d<1) return 'earlier today';
  if(d===1) return 'yesterday';
  return d+' days ago';
}

/* compare now against the snapshot — describes movement, never advises */
function changesSince(){
  const prev=snapRead(), out=[];
  watchGet().forEach(id=>{
    const p=PAIRS.find(x=>x.id===id); if(!p) return;
    const q=prev[id]; if(!q) return;
    const items=[];
    if(q.state!==p.state){
      items.push({kind:'state',
        text:'Status moved from '+LABEL[q.state]+' to '+LABEL[p.state]+'.',
        num:null, col:COL[p.state]});
    }
    const dz=p.zNow-q.z;
    if(Math.abs(dz)>=0.5){
      const dir=Math.abs(p.zNow)>Math.abs(q.z)?'further from':'closer to';
      items.push({kind:'z',
        text:'The spread moved '+dir+' its usual range.',
        num:'z '+fmt(q.z)+'  \u2192  '+fmt(p.zNow), col:COL[p.state]});
    }
    if(q.coint!==p.cointegrated){
      items.push({kind:'coint',
        text: p.cointegrated ? 'Evidence of a real relationship returned.'
                             : 'The evidence that the gap reliably returns has weakened.',
        num:'ADF p '+q.adfp.toFixed(3)+'  \u2192  '+p.adfp.toFixed(3),
        col: p.cointegrated?'var(--stable-text)':'var(--shift-text)'});
    }
    const db=p.beta-q.beta;
    if(Math.abs(db)>=0.05){
      items.push({kind:'beta',
        text:'The hedge ratio shifted, which means the relationship itself is changing shape.',
        num:'\u03b2 '+q.beta.toFixed(3)+'  \u2192  '+p.beta.toFixed(3), col:'var(--watch-text)'});
    }
    if(items.length) out.push({pair:p, items:items});
  });
  return out;
}

function changedHTML(){
  const ch=changesSince();
  if(!ch.length) return '';
  const n=ch.reduce((a,c)=>a+c.items.length,0);
  return `<div class="changed rise" style="animation-delay:60ms">
    <h3>${n} thing${n===1?'':'s'} changed while you were away</h3>
    <div class="when">Compared with your last visit, ${agoText(lastVisit())}.</div>
    ${ch.map(c=>c.items.map(it=>`
      <div class="chg-item">
        <span class="chg-dot" style="background:${it.col}"></span>
        <div class="chg-body">
          <div class="chg-name">${esc(c.pair.an)} / ${esc(c.pair.bn)}</div>
          <div class="chg-what">${it.text}</div>
          ${it.num?`<div class="chg-num">${it.num}</div>`:''}
        </div>
        <button class="chip" data-go="/app/pair/${c.pair.id}">Open</button>
      </div>`).join('')).join('')}
    <div class="foot-note">These describe what moved statistically. They are not recommendations, and a change is not itself a reason to act.</div>
  </div>`;
}

const ICON_WATCH='<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M4 1.6h7v11.8L7.5 10.2 4 13.4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';

/* ══════════════ BREAK TYPING + EVIDENCE ══════════════
   Five distinct ways a relationship stops being true, each
   computed from the series. Nothing here recommends an action;
   every output describes what moved and how strong the evidence is. */

function mean(a){ let t=0; for(let i=0;i<a.length;i++) t+=a[i]; return t/a.length; }
function sd(a){ const m=mean(a); let t=0; for(let i=0;i<a.length;i++) t+=(a[i]-m)*(a[i]-m);
  return Math.sqrt(t/Math.max(1,a.length-1)); }

/* standard error of an OLS slope, and a 95% interval around it */
function betaInterval(x,y){
  const n=x.length, b=olsBeta(x,y);
  const mx=mean(x), my=mean(y);
  let sxx=0, sse=0;
  for(let i=0;i<n;i++){ sxx+=(x[i]-mx)*(x[i]-mx); }
  const a=my-b*mx;
  for(let i=0;i<n;i++){ const e=y[i]-(a+b*x[i]); sse+=e*e; }
  const se=Math.sqrt((sse/Math.max(1,n-2))/Math.max(sxx,1e-12));
  return { beta:b, se:se, lo:b-1.96*se, hi:b+1.96*se, n:n };
}
/* R-squared, reported ONLY on the spread - never on price levels.
   Two unrelated random walks produce a high R2 on levels (spurious
   regression), which is the exact error this product exists to expose. */
function rsqSpread(sp){
  const x=[],y=[];
  for(let i=1;i<sp.length;i++){ x.push(sp[i-1]); y.push(sp[i]); }
  const b=olsBeta(x,y), mx=mean(x), my=mean(y), a=my-b*mx;
  let ssr=0, sst=0;
  for(let i=0;i<x.length;i++){ const f=a+b*x[i]; ssr+=(y[i]-f)*(y[i]-f); sst+=(y[i]-my)*(y[i]-my); }
  return sst>0 ? 1-ssr/sst : 0;
}

/* Scan candidate split points and return the one with the largest
   before/after discrepancy for a given metric. Conceptually the same
   move as a sup-F test: search, then judge the largest result. */
function scanSplit(series, metricFn, minSeg){
  minSeg = minSeg || 250;
  const n = series.length;
  let best = {gap:0, at:null, before:null, after:null};
  for(let k=minSeg; k<=n-minSeg; k+=10){
    const a=metricFn(series.slice(0,k)), b=metricFn(series.slice(k));
    if(a===null||b===null) continue;
    const gap=Math.abs(b-a)/Math.max(Math.abs(a),1e-9);
    if(gap>best.gap) best={gap:gap, at:k, before:a, after:b};
  }
  return best;
}
function scanSplitPaired(x, y, metricFn, minSeg){
  minSeg = minSeg || 250;
  const n = Math.min(x.length,y.length);
  let best={gap:0, at:null, before:null, after:null};
  for(let k=minSeg; k<=n-minSeg; k+=10){
    const a=metricFn(x.slice(0,k), y.slice(0,k));
    const b=metricFn(x.slice(k),   y.slice(k));
    if(a===null||b===null) continue;
    const gap=Math.abs(b-a);
    if(gap>best.gap) best={gap:gap, at:k, before:a, after:b};
  }
  return best;
}
function whenAgo(idx,n){
  const d=n-idx;
  if(d<40) return 'in the last few weeks';
  if(d<130) return 'about '+Math.round(d/21)+' months ago';
  return 'about '+(d/252).toFixed(1)+' years ago';
}

/* ---- the five break types ---- */
function detectBreaks(p){
  const out=[];
  const n=p.logA.length;
  const rA=returns(p.logA), rB=returns(p.logB);

  /* 1 · CORRELATION BREAK - day-to-day co-movement fell away */
  const cS=scanSplitPaired(rA,rB,(a,b)=>corr(a,b));
  if(cS.at!==null && cS.before-cS.after > 0.25){
    out.push({type:'correlation', label:'Correlation break',
      what:'The two have largely stopped moving together day to day.',
      metric:'return correlation', at:cS.at, when:whenAgo(cS.at,n),
      prior:cS.before.toFixed(2), now:cS.after.toFixed(2),
      sev: (cS.before-cS.after>0.45)?'high':'moderate', cls:'shift'});
  }

  /* 2 · SLOPE BREAK - still linked, but by a materially different amount.
     Adjacent 250-day windows, and the shift must be large RELATIVE to beta.
     A raw threshold false-positives on any series whose beta drifts slowly. */
  const sS=scanSplitPaired(p.logB,p.logA,(x,y)=>olsBeta(x,y));
  const relS = sS.at!==null ? Math.abs(sS.after-sS.before)/Math.max(Math.abs(sS.before),0.2) : 0;
  if(relS > 0.60){
    out.push({type:'slope', label:'Slope break',
      what:'They still move together, but by a materially different amount. The relationship has changed shape.',
      metric:'hedge ratio \u03b2', at:sS.at, when:whenAgo(sS.at,n),
      prior:sS.before.toFixed(3), now:sS.after.toFixed(3),
      sev: relS>1.0?'high':'moderate', cls:'shift'});
  }

  /* 3 · RESIDUAL BREAK - they co-move, but the gap misbehaves */
  const rS=scanSplit(p.spread, a=>sd(a));
  const ratio = (rS.at!==null && rS.before>0) ? rS.after/rS.before : 1;
  if(ratio > 3.0){
    out.push({type:'residual', label:'Residual break',
      what:'Broad co-movement looks intact, but deviations from the historical relationship have become abnormal.',
      metric:'spread dispersion', at:rS.at, when:whenAgo(rS.at,n),
      prior:rS.before.toFixed(4), now:rS.after.toFixed(4),
      sev: ratio>3?'high':'moderate', cls:'shift'});
  }

  /* 4 · VOLATILITY BREAK - calm looks fine, stress does not */
  const vS=scanSplit(rA, a=>sd(a));
  const vRatio = (vS.at!==null && vS.before>0) ? vS.after/vS.before : 1;
  if(vRatio > 2.0){
    out.push({type:'volatility', label:'Volatility break',
      what:'Both legs became far more volatile. A relationship measured across calm and stressed periods together can describe neither well.',
      metric:'daily volatility', at:vS.at, when:whenAgo(vS.at,n),
      prior:(vS.before*100).toFixed(2)+'%', now:(vS.after*100).toFixed(2)+'%',
      sev: vRatio>3.5?'high':'moderate', cls:'watch'});
  }

  /* 5 · DATA-QUALITY BREAK - a step that looks like a break and is not.
     An unadjusted corporate action shows up as a one-day jump far outside
     the normal distribution of daily moves. */
  const dq=(()=>{
    const all=rA.concat(rB), sdr=sd(all);
    for(let i=1;i<rA.length;i++){
      const mA=Math.abs(rA[i]), mB=Math.abs(rB[i]);
      if(mA>8*sdr || mB>8*sdr){
        const r=(mA>mB)?rA[i]:rB[i];          /* signed, not absolute */
        return {i:i, leg:(mA>mB)?p.a:p.b, move:(Math.exp(r)-1)*100};
      }
    }
    return null;
  })();
  if(dq){
    out.push({type:'dataquality', label:'Data-quality break',
      what:'A single-session move far outside the normal range for '+esc(dq.leg)+'. This has the shape of a corporate action or a pricing error, not a change in the relationship. Treat the other statistics on this pair as unreliable until the data is corrected.',
      metric:'one-session move', at:dq.i, when:whenAgo(dq.i,n),
      prior:'normal range', now:(dq.move<0?'\u2212':'+')+Math.abs(dq.move).toFixed(0)+'%',
      sev:'check', cls:'watch'});
  }
  return out;
}

/* ---- the evidence label ---- */
function evidenceLabel(p){
  if(p.overlap < 250 || p.z.filter(v=>v!==null).length < 200)
    return {key:'insufficient', text:'Insufficient evidence',
      why:'Too few overlapping observations to support a conclusion.'};
  if(p.breaks.some(b=>b.cls==='shift'))
    return {key:'changed', text:'Structurally changed',
      why:'At least one break in the relationship itself has been detected.'};
  if(p.breaks.length)
    return {key:'weakening', text:'Weakening',
      why:'The relationship is intact but something measurable is moving.'};
  if(!p.cointegrated)
    return {key:'insufficient', text:'Insufficient evidence',
      why:'The gap does not reliably return, so the usual measures do not apply.'};
  return {key:'stable', text:'Historically stable',
    why:'No break detected, and the relationship has held across the window.'};
}

/* ---------- plain-English layer ----------
   Every helper here SUMMARISES a computed statistic in words.
   None of them introduces a judgement, score, ranking or action.
   The number always stays visible next to its sentence.        */

function pctile(z){                     // |z| -> rough share of history inside it
  const a=Math.abs(z);
  if(a<0.5) return 'closer than most of the past 90 days';
  if(a<1)   return 'within the usual range';
  if(a<1.5) return 'wider than about 70% of the past 90 days';
  if(a<2)   return 'wider than about 90% of the past 90 days';
  if(a<2.5) return 'wider than about 95% of the past 90 days';
  return 'wider than almost any point in the past 90 days';
}
function glossZ(p){
  const dir = p.zNow<0 ? 'closer together' : 'further apart';
  return 'The two are '+dir+' than usual \u2014 '+pctile(p.zNow)+'.';
}
function glossBeta(p){
  return 'About '+p.beta.toFixed(2)+' of '+esc(p.b)+' moves with each unit of '+esc(p.a)+'.';
}
function glossRho(p){
  const a=p.rho;
  const w = a>0.85?'very closely':a>0.7?'closely':a>0.5?'loosely':'barely';
  return 'Day to day, they move '+w+' together.';
}
function glossHalfLife(p){
  if(!p.halfLife) return 'No reliable reversion. Gaps here have not been closing.';
  if(p.halfLife>250) return 'Effectively no reversion. Gaps have not been closing.';
  return 'Past gaps have typically closed halfway in about '+p.halfLife.toFixed(0)+' days. '
    + 'Speed, not certainty.';
}
function glossOverlap(p){
  return 'Both have traded on '+p.overlap.toLocaleString()+' of the same days.';
}
function glossAdf(p){
  if(!p.cointegrated) return 'Weak evidence. The gap between these two does not reliably return.';
  return 'Strong evidence the gap is a real relationship, not a coincidence. Evidence, not proof.';
}
function glossDrift(p){
  const a=Math.abs(p.betaDrift);
  if(a<0.03) return 'The relationship has held its shape.';
  if(a<0.08) return 'Slight shift in the relationship. Worth watching.';
  return 'The relationship itself is shifting, not just the gap.';
}

/* the one-sentence answer, assembled from computed values only */
function verdict(p){
  const name = esc(p.an)+' and '+esc(p.bn);
  /* a data problem outranks everything: every other figure is computed from it */
  const dq = p.breaks.find(b=>b.type==='dataquality');
  if(dq){
    return {
      cls:'is-shift',
      lede:'<b>Check the data for '+name+' before reading anything else.</b> '+dq.what,
      caveat:'Every statistic on this page is computed from that series, so treat all of '
          +'it as unreliable until the data is corrected. This is a problem with the input, '
          +'not a finding about the two companies.'
    };
  }
  if(p.broke){
    const named = p.breaks.filter(b=>b.cls==='shift').map(b=>b.label.toLowerCase());
    return {
      cls:'is-shift',
      lede:'<b>'+name+' no longer move together the way they used to.</b> '
          +(named.length?('Detected: '+named.join(', ')+'. '):'')
          +'The usual measures of \u201chow far apart\u201d no longer mean what they normally would.',
      caveat:'Because of that, the divergence statistics below are withheld. They would '
          +'describe a relationship that has stopped holding. This is a result, not an error.'
    };
  }
  const a   = Math.abs(p.zNow);
  const far = a>=2;
  const apart = p.zNow>0;
  let where;
  if(a>=2)      where = apart ? 'unusually far apart right now'
                              : 'unusually close together right now';
  else if(a>=1) where = apart ? 'somewhat further apart than usual right now'
                              : 'somewhat closer together than usual right now';
  else          where = 'about as far apart as they normally are';
  const hl  = p.halfLife && p.halfLife<250
      ? ' Gaps of this kind have historically closed halfway in about '+p.halfLife.toFixed(0)+' days.'
      : '';
  return {
    cls: far?'is-watch':'is-stable',
    lede:'<b>'+name+' have moved together reliably over this window.</b> They are '+where+'.'+hl,
    caveat:'This describes what the numbers have done. It is not a prediction, and not a '
        +'recommendation to trade. A relationship that has held can still stop holding.'
  };
}


/* ---------- break records + evidence card ---------- */
function breaksHTML(p){
  if(!p.breaks.length){
    return `<div class="nobreak">No break detected. The relationship has held its shape across the window
      \u2014 which describes the past, and is not a promise about the future.</div>`;
  }
  const order={high:0,moderate:1,check:2};
  const bs=p.breaks.slice().sort((a,b)=>(order[a.sev]||9)-(order[b.sev]||9));
  return bs.map(b=>`
    <div class="brk ${b.cls}">
      <div class="brk-top">
        <span class="brk-label">${b.label}</span>
        <span class="brk-sev sev-${b.sev}">${b.sev==='check'?'check the data':b.sev}</span>
        ${b.when?`<span class="brk-when">detected ${b.when}</span>`:''}
      </div>
      <div class="brk-what">${b.what}</div>
      <div class="brk-num">
        <span class="m">${b.metric}</span>
        <span>${b.prior}</span><span class="arrow">\u2192</span><span>${b.now}</span>
      </div>
    </div>`).join('');
}

/* ---------- chart interactivity ---------- */
function initCharts(root){
  /* draw-on: set per-path dash length */
  $$('.dw',root).forEach((p,i)=>{
    let len=0;
    try{len=p.getTotalLength();}catch(e){len=1000;}
    p.style.setProperty('--len',len);
    p.style.strokeDasharray=len;
    p.style.strokeDashoffset=len;
    p.style.animation='draw 1.05s cubic-bezier(.16,1,.3,1) '+(120+i*60)+'ms forwards';
  });

  /* count-ups */
  $$('[data-count]',root).forEach(el=>{
    const to=parseFloat(el.getAttribute('data-count'));
    const dec=parseInt(el.getAttribute('data-dec')||'0',10);
    if(!isNaN(to)) countUp(el,to,dec,true);
  });

  /* hover crosshair + readout */
  $$('.chartwrap',root).forEach(w=>{
    const svg=$('svg',w), ro=$('.readout',w), cross=$('.cross',w);
    if(!svg||!cross) return;
    const kind=w.getAttribute('data-series'), p=PAIRS.find(x=>x.id===w.getAttribute('data-id'));
    w.addEventListener('mousemove',e=>{
      const r=w.getBoundingClientRect();
      const frac=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
      const vb=svg.viewBox.baseVal;
      cross.setAttribute('x1',frac*vb.width); cross.setAttribute('x2',frac*vb.width);
      cross.setAttribute('opacity','.85');
      w.classList.add('live');
      ro.style.left=(frac*r.width)+'px'; ro.style.top='6px';
      let txt='';
      if(kind==='z'){
        const z=p.z.filter(v=>v!==null);
        const v=z[Math.floor(frac*(z.length-1))];
        txt='z '+fmt(v,2)+'σ';
      }else{
        const i=Math.floor(frac*(p.logA.length-1));
        txt=p.a+' '+Math.exp(p.logA[i]).toFixed(1)+'   '+p.b+' '+Math.exp(p.logB[i]).toFixed(1);
      }
      ro.textContent=txt;
    });
    w.addEventListener('mouseleave',()=>{cross.setAttribute('opacity','0');w.classList.remove('live');});
  });
}


/* ---------- first-run guide ---------- */

/* ══════════════ GUIDED FIRST PAIR ══════════════
   Not a carousel. The user commits to an answer, is shown the
   evidence, and ends on the product refusing to answer.
   Four steps, skippable at any point, never repeats.        */
let TOUR_STEP=0, TOUR_GUESS=null;

function tourSeen(){
  try{ return localStorage.getItem('rb_tour')==='1'; }catch(e){ return false; }
}
function tourDone(){
  try{ localStorage.setItem('rb_tour','1'); }catch(e){}
  const t=document.getElementById('tour'); if(t) t.removeAttribute('open');
}
function tourOpen(){
  TOUR_STEP=0; TOUR_GUESS=null;
  const t=document.getElementById('tour');
  if(t){ t.setAttribute('open',''); tourPaint(); }
}

function dots(n){
  let o='<div class="dots">';
  for(let i=0;i<4;i++) o+='<span class="dot'+(i<=n?' on':'')+'"></span>';
  return o+'</div>';
}

function tourPaint(){
  const host=document.getElementById('tourBody');
  if(!host) return;
  const ko=PAIRS.find(p=>p.id==='KO-PEP');
  const hd=PAIRS.find(p=>p.id==='HD-LOW');
  let html='';

  if(TOUR_STEP===0){
    html=`
      <div class="step">One of four</div>
      <h2>Before anything else, a question.</h2>
      <p>These two companies have moved together for years. Coca-Cola and PepsiCo \u2014 same shelf, same customers, same weather.</p>
      <div class="chartbox">
        <div class="cap">Both prices, five years</div>
        ${overlay(ko,760,150,200)}
      </div>
      <p><strong>Do you think they are genuinely related \u2014 or do they just happen to drift in the same direction?</strong></p>
      <div class="tourpick">
        <button data-guess="real"><span class="t">Genuinely related</span><span class="s">The link is real</span></button>
        <button data-guess="coincidence"><span class="t">Just coincidence</span><span class="s">They only look connected</span></button>
      </div>
      <div class="tourfoot">${dots(0)}<button class="tourskip" data-tourskip>Skip</button></div>`;
  }

  else if(TOUR_STEP===1){
    const right = TOUR_GUESS==='real';
    html=`
      <div class="step">Two of four</div>
      <h2>Most tools would stop here.</h2>
      <div class="verdictline ${right?'v-right':'v-wrong'}">
        ${right
          ? 'You said related \u2014 and you are right, though not for the reason most tools would give.'
          : 'You said coincidence. Reasonable instinct, and for a great many pairs it would be correct.'}
      </div>
      <p>Their daily movements correlate at <strong>${ko.rho.toFixed(2)}</strong>. Almost every screener in the market would show you that number and call it a pair.</p>
      <p>But correlation only says they wiggle in the same direction. Two unrelated companies in a rising market do that too. <strong>It cannot tell you whether the gap between them ever comes back.</strong></p>
      <div class="tourfoot">${dots(1)}<button class="tourskip" data-tourskip>Skip</button>
        <button class="tournext" data-tournext>So what does?</button></div>`;
  }

  else if(TOUR_STEP===2){
    html=`
      <div class="step">Three of four</div>
      <h2>The gap is the whole subject.</h2>
      <p>RhubArb measures the distance between the two, then asks one question: <strong>does it keep coming back?</strong></p>
      <div class="chartbox">
        <div class="cap">The gap, in standard deviations</div>
        ${zchart(ko,760,150)}
      </div>
      <p>Inside the shaded band is normal. This gap has wandered out and returned repeatedly \u2014 halfway back in about <strong>${ko.halfLife?ko.halfLife.toFixed(0):'\u2014'} days</strong>, historically. That is a tether, and it is a far stronger claim than correlation.</p>
      <div class="tourfoot">${dots(2)}<button class="tourskip" data-tourskip>Skip</button>
        <button class="tournext" data-tournext>Now the important part</button></div>`;
  }

  else {
    html=`
      <div class="step">Four of four</div>
      <h2>And sometimes it stops being true.</h2>
      <p>Here is Home Depot and Lowe's. Same industry, same customers, correlation of <strong>${hd.rho.toFixed(2)}</strong> \u2014 on the face of it, a better pair than the last one.</p>
      <div class="chartbox">
        <div class="cap">The gap \u2014 note the marker</div>
        ${zchart(hd,760,150)}
      </div>
      <p>The relationship broke partway through. The gap stopped returning. And the spread now reads as extreme \u2014 which is exactly when a tool measuring against an old average becomes dangerous.</p>
      <p><strong>So RhubArb withholds those statistics rather than showing them.</strong> Not because it cannot compute them, but because they would describe a relationship that no longer exists.</p>
      <p>That is the whole product. It shows you the working, and it tells you when to stop trusting it.</p>
      <div class="tourfoot">${dots(3)}<button class="tourskip" data-tourskip>Close</button>
        <button class="tournext" data-tourgo>Open that pair</button>
        <div class="tourhint">It will never tell you to trade. That is a design boundary, not an omission.</div></div>`;
  }
  host.innerHTML=html;
  initCharts(host);
}

  if(e.target.closest('[data-tourskip]')){ tourDone(); return; }
  if(e.target.closest('[data-tourreplay]')){ tourOpen(); return; }

  /* watch / unwatch */
  const wb=e.target.closest('[data-watch]');
  if(wb){
    e.stopPropagation();
    const id=wb.getAttribute('data-watch');
    const on=watchToggle(id);
    wb.setAttribute('aria-pressed',String(on));

    if(lbl) wb.innerHTML += '<span class="wl">'+(on?'Watching':'Watch this pair')+'</span>';

  }
  /* marketing demo pair switcher */
  const dsel=e.target.closest('[data-demo]');

    const tmp=document.createElement('div');
    tmp.innerHTML=demoHTML();
    host.replaceChild(tmp.firstElementChild, dsel.closest('.demo'));
    initCharts(host);
    return;
  }
  /* inline term definitions */
  const tm=e.target.closest('.term');
  if(tm){
    const wrap=tm.parentNode;
    const wasOpen=wrap.classList.contains('open');
    $$('.termwrap.open').forEach(w=>{
      w.classList.remove('open');
      const b=w.querySelector('.term'); if(b) b.setAttribute('aria-expanded','false');
    });
    if(!wasOpen){ wrap.classList.add('open'); tm.setAttribute('aria-expanded','true'); }
    e.stopPropagation();
    return;
  }
  $$('.termwrap.open').forEach(w=>{
    w.classList.remove('open');
    const b=w.querySelector('.term'); if(b) b.setAttribute('aria-expanded','false');
  });

  /* show / hide the full working */
  const w=e.target.closest('[data-working]');
  if(w){
    const panel=document.getElementById('working');
    const open=panel.classList.toggle('open');
    w.setAttribute('aria-expanded',String(open));
    w.querySelector('.wtxt').textContent = open ? 'Hide the full working' : 'Show the full working';
    if(open) initCharts(panel);
    return;
  }
  /* terse mode */
  if(e.target.closest('[data-terse]')){
    const terse=document.body.classList.toggle('terse');
    const b=document.getElementById('expBtn');
    if(b) b.textContent = terse ? 'Show explanations' : 'Hide explanations';
    /* keep the tab order honest: a term button that does nothing shouldn't be focusable */
    $$('.term').forEach(t=>{ t.disabled = terse; });

  if(go){ e.preventDefault(); location.hash='#'+go.getAttribute('data-go'); return; }
  const f=e.target.closest('[data-f]');
  if(f){
    const k=f.getAttribute('data-f');
    F[k]=!F[k];
    f.setAttribute('aria-pressed',String(F[k]));
    applyFilters();
  }
});

function pHow(){

function pMethodPage(){
  const defs=[
   ['Hedge ratio β','Ordinary least squares in log space, over the common trading window. Log space so that percentage moves are comparable between assets at different price levels.'],

   ['Cointegration','Engle–Granger, with an augmented Dickey–Fuller test on the residual. The null hypothesis is non-stationarity, so rejecting it is evidence the gap returns.'],
   ['Half-life','An AR(1) / Ornstein–Uhlenbeck fit on the spread. Undefined when the fitted coefficient is positive, which means the series is diverging rather than reverting.'],
   ['Return correlation','Pearson correlation of daily log returns, never price levels. Levels correlate for any two assets that trend together, which is why they mislead.']
  ];
  return `

      <h2 class="sec">How each figure is computed</h2>

  ${footer()}`;
}

function tracesSVG(w,h,n){
  let out='<svg class="traces" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">';
  const r=rng(1337);
  for(let i=0;i<n;i++){
    const x0=(i/n)*w+8, span=w/n-16, mid=x0+span*0.5, y0=h/2, amp=7+r()*17;
    const breaks=r()<0.14;
    const d1='M '+x0+' '+y0+' L '+(mid-span*0.25)+' '+(y0-amp)+' L '+(mid+span*0.25)+' '+(y0-amp)+' L '+(x0+span)+' '+y0;
    const d2= breaks
      ? 'M '+x0+' '+y0+' L '+(mid-span*0.25)+' '+(y0+amp)+' L '+(x0+span+46)+' '+(y0+amp+22)
      : 'M '+x0+' '+y0+' L '+(mid-span*0.25)+' '+(y0+amp)+' L '+(mid+span*0.25)+' '+(y0+amp)+' L '+(x0+span)+' '+y0;
    out+='<path class="dw" d="'+d1+'" fill="none" stroke="var(--rhubarb-400)" stroke-width="2.1" stroke-linejoin="round"/>';
    out+='<path class="dw" d="'+d2+'" fill="none" stroke="'+(breaks?'var(--shift)':'var(--rhubarb-500)')+'" stroke-width="2.1" stroke-linejoin="round"/>';
    out+='<circle cx="'+x0+'" cy="'+y0+'" r="2.6" fill="var(--rhubarb-500)" opacity="0" style="animation:fadeIn .4s var(--ease) '+(i*70+250)+'ms forwards"/>';
  }
  return out+'</svg>';
}
